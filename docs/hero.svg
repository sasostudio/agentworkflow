<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="AgentWorkflow loop: you approve a TODO, a builder makes the change, a read-only evaluator judges it and may send it back, a fresh-session rebuttal review tries to refute the pass, and you give the final approval. Underneath, the engine fences the files, watches usage and resumes after a crash.">
  <title>AgentWorkflow: the builder never grades its own work</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#fbfaf7" stroke="#e4e0d8"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- row of steps -->
    <rect x="24" y="44" width="148" height="92" rx="12" fill="#ffffff" stroke="#c9c3b8"/>
    <text x="98" y="80" font-size="16" font-weight="700" fill="#1f2328">You approve</text>
    <text x="98" y="102" font-size="13" fill="#59636e">the TODO</text>
    <text x="98" y="120" font-size="12" fill="#59636e">files · done criteria</text>

    <rect x="204" y="44" width="148" height="92" rx="12" fill="#ffffff" stroke="#c9c3b8"/>
    <text x="278" y="80" font-size="16" font-weight="700" fill="#1f2328">Builder</text>
    <text x="278" y="102" font-size="13" fill="#59636e">makes the change</text>
    <text x="278" y="120" font-size="12" fill="#59636e">one session · Sonnet</text>

    <rect x="384" y="44" width="148" height="92" rx="12" fill="#eef6f0" stroke="#2f7d4f"/>
    <text x="458" y="80" font-size="16" font-weight="700" fill="#1f2328">Evaluator</text>
    <text x="458" y="102" font-size="13" fill="#59636e">read-only · Opus</text>
    <text x="458" y="120" font-size="12" fill="#59636e">writes QA scenarios</text>

    <rect x="564" y="44" width="148" height="92" rx="12" fill="#eef6f0" stroke="#2f7d4f"/>
    <text x="638" y="80" font-size="16" font-weight="700" fill="#1f2328">Rebuttal</text>
    <text x="638" y="102" font-size="13" fill="#59636e">fresh session</text>
    <text x="638" y="120" font-size="12" fill="#59636e">tries to refute "pass"</text>

    <rect x="744" y="44" width="112" height="92" rx="12" fill="#fff4e5" stroke="#c4711a"/>
    <text x="800" y="80" font-size="16" font-weight="700" fill="#1f2328">You</text>
    <text x="800" y="102" font-size="13" fill="#59636e">final</text>
    <text x="800" y="120" font-size="13" fill="#59636e">approval</text>

    <path d="M172 90H202" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
    <path d="M352 90H382" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
    <path d="M532 90H562" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
    <path d="M712 90H742" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
    <!-- reject loop -->
    <path d="M458 136C458 162 278 162 278 138" fill="none" stroke="#b3361f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="368" y="188" font-size="13" font-weight="600" fill="#b3361f">REJECT: its words go to the builder as is</text>

    <!-- engine rail -->
    <rect x="24" y="206" width="832" height="100" rx="12" fill="#f1efe9" stroke="#d6d1c6"/>
    <text x="440" y="232" font-size="13" font-weight="700" fill="#1f2328" letter-spacing="0.5">THE ENGINE (code, no AI) RUNS IT UNATTENDED</text>
    <text x="164" y="262" font-size="13" fill="#1f2328">Scope fence</text>
    <text x="164" y="282" font-size="12" fill="#59636e">edit outside the TODO → auto-reject</text>
    <text x="440" y="262" font-size="13" fill="#1f2328">Usage watch</text>
    <text x="440" y="282" font-size="12" fill="#59636e">cut mid-call at 95 % / 97 % · resume same session</text>
    <text x="716" y="262" font-size="13" fill="#1f2328">Crash-proof</text>
    <text x="716" y="282" font-size="12" fill="#59636e">write-ahead state · supervisor restarts</text>
  </g>
</svg>
